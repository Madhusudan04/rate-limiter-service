version: '3.8'

services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  rate-limiter:
    build: .
    ports:
      - "8080:8080"
    environment:
      - SPRING_REDIS_HOST=redis
      - SPRING_REDIS_PORT=6379
      - LOGGING_LEVEL_COM_RATELIMITER=DEBUG
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - ./rules.json:/app/rules.json
      - ./logs:/app/logs
    restart: unless-stopped

volumes:
  redis-data:
